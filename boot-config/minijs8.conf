# MiniJS8 — boot config additions
# ================================
# Appended to /boot/firmware/config.txt by build.sh.
# Keep entries idempotent: build.sh greps before appending.

# Disable built-in audio so the QDX's USB sound card enumerates as
# card 0. This keeps ALSA's default device pointing at the radio and
# avoids the application having to discover the card index at runtime.
dtparam=audio=off

# SPI for the Adafruit Mini PiTFT 1.3" ST7789 display.
dtparam=spi=on

# Disable Bluetooth. We don't use it, and disabling it frees the UART
# back to GPIO14/15 (cleaner GPIO map) and shaves a small amount of
# idle power and boot time on the Pi Zero 2W.
dtoverlay=disable-bt

# I2C is not used in v1 but enabling the pins doesn't hurt and leaves
# room for a future hardware RTC or sensor add-on without re-flashing.
dtparam=i2c_arm=on

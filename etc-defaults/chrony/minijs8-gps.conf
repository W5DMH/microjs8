# MiniJS8 — chrony GPS time discipline
# =====================================
# Drop-in installed at /etc/chrony/conf.d/minijs8-gps.conf.
#
# gpsd populates SHM segment 0 with the NMEA-derived time (no PPS, so
# precision is ~100 ms — fine for JS8's ±1 s timing requirement).
#
# offset 0.5 compensates for typical NMEA latency on USB serial.
# noselect at first; we'll let chrony pick it after we've validated
# the offset under operating conditions (Step 4 acceptance check).

# SHM 0 is gpsd's main NMEA time channel.
refclock SHM 0 refid GPS precision 1e-1 offset 0.5 delay 0.2

# Don't disable internet NTP — when on a network, internet pool servers
# are still better-disciplined than NMEA-only GPS. The selection
# algorithm picks whichever has lower estimated error, so internet
# pool when available, GPS when off-grid.
